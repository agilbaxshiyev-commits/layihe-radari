name: Layihe Radari

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect, analyse, notify
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
          PANEL_URL: ${{ vars.PANEL_URL }}
        run: python -m radar run
      - name: Publish data
        run: |
          git config user.name "layihe-radar"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/projects.json
          git diff --cached --quiet || git commit -m "data: refresh projects"
          git push
